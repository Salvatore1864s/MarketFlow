
name: MarketFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore MarketFlow.slnx

      - name: Build solution
        run: dotnet build MarketFlow.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test MarketFlow.slnx --no-build --configuration Release --verbosity normal
