services:
  postgres:
    image: postgres:17-alpine
    container_name: marketflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marketflow_admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d marketflow_admin"]
      interval: 5s
      timeout: 5s
      retries: 15

  database-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for db in identity_db catalog_db orders_db inventory_db payment_db; do
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${db}'" | grep -q 1; then
            createdb "$${db}"
          fi
        done
        echo "All MarketFlow databases are ready."

  rabbitmq:
    image: rabbitmq:4-management
    container_name: marketflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: marketflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  identity:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Identity/Identity.Api/Identity.Api.csproj
        APP_DLL: Identity.Api.dll
    container_name: marketflow-identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=identity_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: MarketFlow.Identity
      Jwt__Audience: MarketFlow.Client
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
    ports:
      - "5021:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Catalog/Catalog.Api/Catalog.Api.csproj
        APP_DLL: Catalog.Api.dll
    container_name: marketflow-catalog
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=catalog_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: MarketFlow.Identity
      Jwt__Audience: MarketFlow.Client
    ports:
      - "5022:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully

  orders:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Orders/Orders.Api/Orders.Api.csproj
        APP_DLL: Orders.Api.dll
    container_name: marketflow-orders
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=orders_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: MarketFlow.Identity
      Jwt__Audience: MarketFlow.Client
      Services__Catalog__BaseUrl: http://catalog:8080/
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5023:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started

  inventory:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Inventory/Inventory.Api/Inventory.Api.csproj
        APP_DLL: Inventory.Api.dll
    container_name: marketflow-inventory
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=inventory_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: MarketFlow.Identity
      Jwt__Audience: MarketFlow.Client
      Services__Catalog__BaseUrl: http://catalog:8080/
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5024:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started

  payment:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Payment/Payment.Api/Payment.Api.csproj
        APP_DLL: Payment.Api.dll
    container_name: marketflow-payment
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=payment_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: MarketFlow.Identity
      Jwt__Audience: MarketFlow.Client
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5025:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT_PATH: src/Gateway/Gateway.Api/Gateway.Api.csproj
        APP_DLL: Gateway.Api.dll
    container_name: marketflow-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: http://identity:8080/
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: http://catalog:8080/
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: http://orders:8080/
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: http://inventory:8080/
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: http://payment:8080/
    ports:
      - "5110:8080"
    depends_on:
      - identity
      - catalog
      - orders
      - inventory
      - payment

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: marketflow-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
      - orders

volumes:
  postgres_data:
  redis_data:
